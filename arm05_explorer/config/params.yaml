aruco_detector:
  ros__parameters:
    use_sim_time: true
    marker_size: 0.07
    cube_size: 0.09
    camera_frame: camera_rgb_optical_frame
    map_frame: map
    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info
    max_detection_range: 3.0
    min_marker_perimeter_px: 60.0
    max_z_error: 0.10
    process_every_n: 1
    debug_image_scale: 0.5
 
search_server:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    base_frame: base_footprint
    coarse_resolution: 0.2
    robot_clearance: 0.35
    target_wall_margin: 0.25
    sensor_range: 2.5
    sensor_min_range: 0.3
    candidate_step: 0.4
    coverage_target: 0.97
    min_gain_cells: 5
    n_rays: 180
    nav_timeout: 120.0
    spin_angle: 6.283185
    spin_time_allowance: 40
    min_observations: 3
    default_timeout: 900.0
    result_file: ~/.ros/arm05_explorer/last_result.txt